services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:18123:8123"
    environment:
      CLICKHOUSE_DB: dogpaddle
      CLICKHOUSE_USER: dogpaddle
      CLICKHOUSE_PASSWORD: dogpaddle
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

  doris:
    image: apache/doris:all-in-one-4.1.3
    ports:
      - "127.0.0.1:18030:8030"
      - "127.0.0.1:18040:8040"
      - "127.0.0.1:19030:9030"
