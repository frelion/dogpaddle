[package]
name = "dogpaddle-debezium-d1-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
dogpaddle-debezium = { path = "../../../crates/debezium" }
serde = { version = "=1.0.229", features = ["derive"] }
