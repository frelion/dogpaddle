version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /system-tests/debezium-postgres/host
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      d1-host-rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /crates/debezium/bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bridge-build-and-test-dependencies:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.junit.jupiter:*"
    ignore:
      # Patch this line as a family; review minor and major upgrades with Debezium.
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The binding must match the SLF4J API selected by the Debezium BOM.
      - dependency-name: "org.slf4j:slf4j-simple"

  - package-ecosystem: maven
    directory: /system-tests/debezium-runtime/probe
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      probe-build-dependencies:
        patterns:
          - "org.apache.maven.plugins:*"
    ignore:
      # The probe must compile against the exact Kafka API in the runtime bundle.
      - dependency-name: "org.apache.kafka:connect-api"
