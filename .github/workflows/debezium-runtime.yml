name: Debezium runtime bundles

on:
  pull_request:
    paths:
      - ".github/workflows/debezium-runtime.yml"
      - "crates/debezium/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/debezium-runtime.yml"
      - "crates/debezium/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debezium-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  distribution:
    name: Java distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore and save Maven cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: debezium-maven-v1-${{ hashFiles('crates/debezium/bridge/pom.xml') }}

      - name: Show Java build toolchain
        run: java -version && mvn --version

      - name: Build and test the Java distribution
        run: crates/debezium/scripts/build-distribution.sh

      - name: Upload the Java distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogpaddle-debezium-java-distribution
          path: crates/debezium/bridge/target/distribution
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    name: Bundle ${{ matrix.target }}
    needs: distribution
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Download the Java distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogpaddle-debezium-java-distribution
          path: crates/debezium/bridge/target/distribution

      - name: Restore and save Cargo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: debezium-cargo-v1-${{ matrix.target }}-1.96-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            debezium-cargo-v1-${{ matrix.target }}-1.96-

      - name: Show native build toolchain
        run: rustc --version --verbose && cargo --version --verbose && python3 --version

      - name: Build the native public-API probe
        run: >-
          cargo build --locked --release
          -p dogpaddle-debezium --example bundled_runtime_probe

      - name: Assemble the self-contained runtime bundle
        run: crates/debezium/scripts/build-runtime-bundle.sh "${{ matrix.target }}"

      - name: Verify the archived bundle after relocation without system Java
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          bundle_name="dogpaddle-debezium-runtime-$TARGET"
          bundles_dir="$GITHUB_WORKSPACE/crates/debezium/bridge/target/bundles"
          archive="$bundles_dir/$bundle_name.tar.gz"
          checksum="$archive.sha256"

          (
            cd "$bundles_dir"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check "$(basename "$checksum")"
            else
              shasum -a 256 --check "$(basename "$checksum")"
            fi
          )

          rm -rf -- "$bundles_dir/$bundle_name"
          relocated_parent="$RUNNER_TEMP/DogPaddle runtime smoke $TARGET"
          mkdir -p -- "$relocated_parent"
          tar -xzf "$archive" -C "$relocated_parent"
          relocated_bundle="$relocated_parent/$bundle_name"
          probe="$GITHUB_WORKSPACE/target/release/examples/bundled_runtime_probe"

          empty_path="$RUNNER_TEMP/dogpaddle-empty-path-$TARGET"
          missing_java="$RUNNER_TEMP/dogpaddle-missing-java-$TARGET"
          mkdir -p -- "$empty_path"
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          PATH="$empty_path" \
          JAVA_HOME="$missing_java" \
          JDK_HOME="$missing_java" \
          LD_LIBRARY_PATH= \
          DYLD_LIBRARY_PATH= \
          DYLD_FALLBACK_LIBRARY_PATH= \
            "$probe" "$relocated_bundle"

      - name: Upload the runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogpaddle-debezium-runtime-${{ matrix.target }}
          path: |
            crates/debezium/bridge/target/bundles/dogpaddle-debezium-runtime-${{ matrix.target }}.tar.gz
            crates/debezium/bridge/target/bundles/dogpaddle-debezium-runtime-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
