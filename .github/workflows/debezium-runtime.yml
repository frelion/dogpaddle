name: Runtime bundles and releases

on:
  pull_request:
    paths:
      - ".github/workflows/debezium-runtime.yml"
      - "crates/debezium/**"
      - "crates/dogpaddle/**"
      - "system-tests/debezium-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/debezium-runtime.yml"
      - "crates/debezium/**"
      - "crates/dogpaddle/**"
      - "system-tests/debezium-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debezium-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  distribution:
    name: Java distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          expected = f"v{manifest['workspace']['package']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal workspace version {expected!r}")
          PY

      - name: Restore and save Maven cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debezium-maven-cache
          key: debezium-maven-v2-${{ hashFiles('crates/debezium/bridge/pom.xml', 'system-tests/debezium-runtime/probe/pom.xml') }}

      - name: Build and test the Java distribution in the pinned Maven image
        run: |
          set -euo pipefail
          maven_image="docker.io/library/maven@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237"
          maven_home="$GITHUB_WORKSPACE/target/debezium-maven-cache"
          mkdir -p -- "$maven_home"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/dogpaddle-maven \
            --env MAVEN_CONFIG=/tmp/dogpaddle-maven/.m2 \
            --env MAVEN_OPTS=-Duser.home=/tmp/dogpaddle-maven \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$maven_home:/tmp/dogpaddle-maven/.m2" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "$maven_image" \
            -c 'set -euo pipefail
            crates/debezium/scripts/build-distribution.sh
            system-tests/debezium-runtime/probe/build.sh'

      - name: Upload the Java distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogpaddle-debezium-java-distribution
          path: crates/debezium/bridge/target/distribution
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload the test-only lifecycle probe connector
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogpaddle-debezium-lifecycle-probe
          path: target/debezium-runtime-probe/dogpaddle-debezium-lifecycle-probe.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    name: Bundle ${{ matrix.target }}
    needs: distribution
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:bbb43f784ce78a454a9e3351b862a12e7ad5c30972e8aeba092da678918bbba9
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain 1.96.0

      - name: Restore and save Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}
          key: release-cargo-v2-${{ matrix.target }}-1.96-${{ hashFiles('Cargo.lock', '.github/workflows/debezium-runtime.yml', 'crates/dogpaddle/scripts/build-release-binaries.sh') }}
          restore-keys: |
            release-cargo-v2-${{ matrix.target }}-1.96-

      - name: Download the Java distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogpaddle-debezium-java-distribution
          path: crates/debezium/bridge/target/distribution

      - name: Download the test-only lifecycle probe connector
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogpaddle-debezium-lifecycle-probe
          path: ${{ runner.temp }}/debezium-runtime-probe

      - name: Build portable Linux release binaries against glibc 2.28
        if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo_home="$(dirname -- "$(dirname -- "$(command -v cargo)")")"
          rustup_home="$(rustup show home)"
          toolchain_bin="$(rustup run 1.96.0 rustc --print sysroot)/bin"
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              libclang_url="https://files.pythonhosted.org/packages/1d/fc/716c1e62e512ef1c160e7984a73a5fc7df45166f2ff3f254e71c58076f7c/libclang-18.1.1-py2.py3-none-manylinux2010_x86_64.whl"
              libclang_sha256="c533091d8a3bbf7460a00cb6c1a71da93bffe148f172c7d03b1c31fbf8aa2a0b"
              ;;
            aarch64-unknown-linux-gnu)
              libclang_url="https://files.pythonhosted.org/packages/3c/3d/f0ac1150280d8d20d059608cf2d5ff61b7c3b7f7bcf9c0f425ab92df769a/libclang-18.1.1-py2.py3-none-manylinux2014_aarch64.whl"
              libclang_sha256="54dda940a4a0491a9d1532bf071ea3ef26e6dbaf03b5000ed94dd7174e8f9592"
              ;;
          esac
          libclang_wheel="$RUNNER_TEMP/libclang-$TARGET.whl"
          libclang_root="$RUNNER_TEMP/libclang-$TARGET"
          curl --fail --location --retry 3 --output "$libclang_wheel" "$libclang_url"
          printf '%s  %s\n' "$libclang_sha256" "$libclang_wheel" | sha256sum --check -
          mkdir -p -- "$libclang_root"
          python3 -m zipfile -e "$libclang_wheel" "$libclang_root"
          libclang_file="$(find "$libclang_root" -path '*/clang/native/libclang.so' -type f -print -quit)"
          test -n "$libclang_file"
          libclang_path="$(dirname -- "$libclang_file")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME="$cargo_home" \
            --env LIBCLANG_PATH="$libclang_path" \
            --env TARGET="$TARGET" \
            --env TOOLCHAIN_BIN="$toolchain_bin" \
            --volume "$cargo_home:$cargo_home" \
            --volume "$libclang_root:$libclang_root:ro" \
            --volume "$rustup_home:$rustup_home:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "$BUILD_IMAGE" \
            -c 'set -euo pipefail
            export PATH="$TOOLCHAIN_BIN:$PATH"
            export RUSTC="$TOOLCHAIN_BIN/rustc"
            compiler_include_dir="$(gcc -print-file-name=include)"
            test -f "$compiler_include_dir/stdbool.h"
            export BINDGEN_EXTRA_CLANG_ARGS="-isystem $compiler_include_dir"
            rustc --version --verbose
            cargo --version --verbose
            crates/dogpaddle/scripts/build-release-binaries.sh "$TARGET"'

      - name: Build portable macOS release binaries
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustc --version --verbose
          cargo --version --verbose
          python3 --version
          crates/dogpaddle/scripts/build-release-binaries.sh "$TARGET"

      - name: Sign the macOS release executables
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" \
            || -z "$MACOS_CERTIFICATE_PASSWORD" \
            || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo 'tagged macOS releases require signing certificate secrets' >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/dogpaddle-release-certificate.p12"
          keychain="$RUNNER_TEMP/dogpaddle-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" \
            | openssl base64 -d -A -out "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          crates/dogpaddle/scripts/sign-macos-release.sh \
            "$TARGET" "$MACOS_SIGNING_IDENTITY"
          rm -f -- "$certificate"

      - name: Assemble the self-contained runtime bundle
        run: crates/debezium/scripts/build-runtime-bundle.sh "${{ matrix.target }}"

      - name: Verify the relocated bundle through the public lifecycle without system Java
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          bundle_name="dogpaddle-debezium-runtime-$TARGET"
          bundles_dir="$GITHUB_WORKSPACE/crates/debezium/bridge/target/bundles"
          archive="$bundles_dir/$bundle_name.tar.gz"
          probe="$GITHUB_WORKSPACE/target/$TARGET/release/bundled_runtime_probe"
          probe_connector="$RUNNER_TEMP/debezium-runtime-probe/dogpaddle-debezium-lifecycle-probe.jar"

          system-tests/debezium-runtime/probe/verify-bundle.sh \
            "$TARGET" \
            "$archive" \
            "$probe" \
            "$probe_connector" \
            "$RUNNER_TEMP"

      - name: Assemble the DogPaddle release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_id="$GITHUB_REF_NAME"
          else
            release_id="ci-${GITHUB_SHA:0:12}"
          fi
          crates/dogpaddle/scripts/build-release-archive.sh "$TARGET" "$release_id"
          echo "RELEASE_ID=$release_id" >>"$GITHUB_ENV"

      - name: Audit the complete native release archive
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 crates/dogpaddle/scripts/audit-release-archive.py
          "$TARGET"
          "target/release-packages/dogpaddle-$RELEASE_ID-$TARGET.tar.gz"
          "target/release-packages/dogpaddle-$RELEASE_ID-$TARGET.compatibility.txt"

      - name: Verify the relocated final release
        env:
          TARGET: ${{ matrix.target }}
        run: |
          system-tests/debezium-runtime/probe/verify-release.sh \
            "$TARGET" \
            "$GITHUB_WORKSPACE/target/release-packages/dogpaddle-$RELEASE_ID-$TARGET.tar.gz" \
            "$GITHUB_WORKSPACE/target/$TARGET/release/bundled_runtime_probe" \
            "$RUNNER_TEMP/debezium-runtime-probe/dogpaddle-debezium-lifecycle-probe.jar" \
            "$RUNNER_TEMP"

      - name: Notarize the macOS release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_NOTARY_ISSUER_ID" \
            || -z "$MACOS_NOTARY_KEY_ID" \
            || -z "$MACOS_NOTARY_KEY_P8_BASE64" ]]; then
            echo 'tagged macOS releases require App Store Connect notarization secrets' >&2
            exit 1
          fi
          api_key="$RUNNER_TEMP/AuthKey_$MACOS_NOTARY_KEY_ID.p8"
          printf '%s' "$MACOS_NOTARY_KEY_P8_BASE64" \
            | openssl base64 -d -A -out "$api_key"
          crates/dogpaddle/scripts/notarize-macos-release.sh \
            "$GITHUB_WORKSPACE/target/release-packages/dogpaddle-$RELEASE_ID-$TARGET.tar.gz" \
            "$api_key" \
            "$MACOS_NOTARY_KEY_ID" \
            "$MACOS_NOTARY_ISSUER_ID"
          rm -f -- "$api_key"

      - name: Upload the DogPaddle release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogpaddle-release-${{ matrix.target }}
          path: target/release-packages/dogpaddle-${{ env.RELEASE_ID }}-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove the temporary macOS signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/dogpaddle-release.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f -- "$RUNNER_TEMP/dogpaddle-release-certificate.p12"
          rm -f -- "$RUNNER_TEMP"/AuthKey_*.p8

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dogpaddle-release-*
          path: ${{ runner.temp }}/dogpaddle-release
          merge-multiple: true

      - name: Publish the immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP"/dogpaddle-release/*.tar.gz
          "$RUNNER_TEMP"/dogpaddle-release/*.sha256
          "$RUNNER_TEMP"/dogpaddle-release/*.compatibility.txt
          --verify-tag
          --generate-notes
          --title "DogPaddle $GITHUB_REF_NAME"
