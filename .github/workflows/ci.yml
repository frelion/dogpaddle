name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Workspace check (Rust 1.96)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Restore and save Cargo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-1.96-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-1.96-

      - name: Show toolchain
        run: rustc --version --verbose && cargo --version --verbose

      - name: Run the canonical workspace gate
        run: cargo xtask check

  performance-smoke:
    name: Performance smoke
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Restore checked build artifacts
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-1.96-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-1.96-

      - name: Run Criterion targets in test mode
        run: cargo test --workspace --benches --locked

      - name: Run owner-specific smoke workloads
        env:
          DOGPADDLE_PERF_PROFILE: smoke
        run: |
          set -euo pipefail
          run_smoke() {
            local name="$1"
            shift
            local output="$RUNNER_TEMP/$name.jsonl"
            "$@" | tee "$output"
            test -s "$output"
            jq --exit-status --slurp 'length > 0' "$output" >/dev/null
          }
          run_smoke change-codec cargo bench --locked -p dogpaddle-change --bench change_codec
          run_smoke ordered-map cargo bench --locked -p dogpaddle-store --bench ordered_map
          run_smoke append-log cargo bench --locked -p dogpaddle-store --bench append_log
          run_smoke flow-runtime cargo bench --locked -p dogpaddle-flow --bench flow_runtime
          run_smoke append-log-endurance cargo bench --locked -p dogpaddle-store --bench append_log_endurance
