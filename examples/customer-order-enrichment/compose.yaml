name: dogpaddle-customer-order-enrichment

services:
  postgres:
    image: docker.io/library/postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: dogpaddle
      POSTGRES_USER: dogpaddle
      POSTGRES_PASSWORD: dogpaddle
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=8, -c, max_wal_senders=8, -c, max_slot_wal_keep_size=256MB]
    ports:
      - "127.0.0.1:${DOGPADDLE_CUSTOMER_ORDERS_PG_PORT}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U dogpaddle -d dogpaddle && psql -U dogpaddle -d dogpaddle -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM sales.orders LIMIT 0' >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./setup-postgres.sql:/docker-entrypoint-initdb.d/00-example.sql:ro,Z

  mysql:
    image: docker.io/library/mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_ROOT_PASSWORD: dogpaddle-root
    command: [mysqld, --server-id=1, --log-bin=mysql-bin, --binlog-format=ROW, --binlog-row-image=FULL, --lower-case-table-names=0, --binlog-expire-logs-seconds=86400, --mysql-native-password=ON]
    ports:
      - "127.0.0.1:${DOGPADDLE_CUSTOMER_ORDERS_MYSQL_PORT}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=dogpaddle mysql --protocol=TCP -h 127.0.0.1 -u dogpaddle --ssl-mode=DISABLED -e 'SELECT 1 FROM crm.customers LIMIT 0'
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./setup-mysql.sql:/docker-entrypoint-initdb.d/00-example.sql:ro,Z
      - ./setup-mysql-user.sql:/docker-entrypoint-initdb.d/01-user.sql:ro,Z

volumes:
  postgres-data:
  mysql-data:
