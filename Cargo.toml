[workspace]
members = [
    "crates/change",
    "crates/flow",
    "crates/operation",
    "crates/store",
    "integration-tests/change-store",
    "test-support/bench-protocol",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
arrow-array = "=59.2.0"
arrow-buffer = "=59.2.0"
arrow-ipc = "=59.2.0"
arrow-schema = "=59.2.0"
dogpaddle-bench-protocol = { path = "test-support/bench-protocol" }
dogpaddle-change = { path = "crates/change" }
dogpaddle-operation = { path = "crates/operation" }
dogpaddle-store = { path = "crates/store" }
flatbuffers = { version = "=25.12.19", default-features = false }
libmdbx = { version = "=0.6.6", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
