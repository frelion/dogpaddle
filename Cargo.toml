[workspace]
members = ["crates/flow", "crates/operation", "crates/store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
libmdbx = { version = "=0.6.6", default-features = false }
thiserror = "=2.0.20"
tempfile = "=3.27.0"
dogpaddle-store = { path = "crates/store" }
dogpaddle-operation = { path = "crates/operation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
